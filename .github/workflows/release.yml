name: Build Windows app

# Every push to main builds a new Windows installer and publishes it as a GitHub release.
# Installed apps check these releases and offer the update.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Set version 1.0.<build number>
        shell: bash
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Create the release (the installer is uploaded into it next)
        shell: bash
        run: gh release create "v1.0.${{ github.run_number }}" --title "1.0.${{ github.run_number }}" --notes "${{ github.event.head_commit.message }}" --target "${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish installer
        run: npm run dist:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
